# Every tool that the repo needs is pinned here. `mise install` installs them.

[tools]
node = "24.22.0"
pnpm = "12.11.2"
biome = "2.5.15"
lefthook = "2.2.2"
cocogitto = "7.0.0"
gitleaks = "8.30.1"
rumdl = "0.2.79"

[tasks.install]
description = "Install the locked dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.setup]
description = "Install the dependencies and the git hooks"
depends = ["install"]
run = "lefthook install"

[tasks.dev]
description = "Start the Vite dev server"
run = "pnpm exec vite"

[tasks.build]
description = "Build the app into dist/"
run = "pnpm exec vite build"

[tasks.test]
description = "Run the tests. This example has none"
run = "echo 'No tests'"

[tasks."lint:js"]
description = "Biome, with warnings as errors"
run = "biome check --error-on-warnings ."

[tasks."lint:md"]
description = "Markdown structure and formatting"
run = "rumdl check ."

[tasks."lint:secrets"]
description = "Scan the working tree for committed secrets"
run = "gitleaks dir . --no-banner"

[tasks.lint]
description = "Every linter"
depends = ["lint:js", "lint:md", "lint:secrets"]

[tasks.format]
description = "Apply every formatter"
run = ["biome check --write .", "rumdl check --fix ."]

[tasks.check]
description = "The gate: run it before you finish a change"
run = ["mise run lint", "mise run test"]

[tasks.ci]
description = "Run exactly what CI runs. The pre-push hook and the CI workflow call it"
run = ["mise run install", "mise run check", "mise run build"]
